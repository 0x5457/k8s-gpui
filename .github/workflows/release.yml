## Release flow: a tag creates a draft release, builds assets, uploads them, and publishes the release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "600"

jobs:
  validate_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the release tag and updater signing settings
        id: version
        shell: bash
        env:
          K8S_GPUI_UPDATE_PUBLIC_KEY: ${{ vars.K8S_GPUI_UPDATE_PUBLIC_KEY }}
          K8S_GPUI_UPDATE_SIGNING_KEY: ${{ secrets.K8S_GPUI_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("Cargo.toml").open("rb") as stream:
              print(tomllib.load(stream)["workspace"]["package"]["version"])
          PY
          )"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::GITHUB_REF_NAME=$GITHUB_REF_NAME does not match v${version}. Push a tag named v${version}."
            exit 1
          fi
          missing=()
          [[ -n "${K8S_GPUI_UPDATE_PUBLIC_KEY:-}" ]] || missing+=(K8S_GPUI_UPDATE_PUBLIC_KEY)
          [[ -n "${K8S_GPUI_UPDATE_SIGNING_KEY:-}" ]] || missing+=(K8S_GPUI_UPDATE_SIGNING_KEY)
          if ((${#missing[@]})); then
            echo "::error::Missing updater settings: ${missing[*]}. Set K8S_GPUI_UPDATE_PUBLIC_KEY as a repository variable and K8S_GPUI_UPDATE_SIGNING_KEY as a repository secret."
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          python3 scripts/sign_update_manifest.py check-key

  create_draft_release:
    needs: validate_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already published. Do not modify it."
              exit 1
            fi
            echo "Release $GITHUB_REF_NAME already exists. Skip creation."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes
          fi

  bundle_linux:
    needs: [validate_release, create_draft_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      CC: clang
      CXX: clang++
      K8S_GPUI_UPDATE_PUBLIC_KEY: ${{ vars.K8S_GPUI_UPDATE_PUBLIC_KEY }}
      K8S_GPUI_UPDATE_MANIFEST_URL: https://github.com/0x5457/k8s-gpui/releases/latest/download/update-linux-${{ matrix.arch }}.json
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 1
          persist-credentials: false

      # Install the Linux dependencies for the application.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm make cmake pkg-config \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libstdc++-12-dev libva-dev libvulkan1 libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev \
            git curl jq

      # Match the Rust toolchain pin.
      - uses: dtolnay/rust-toolchain@1.98.1

      # Deliberately not the mbx action: its GitHub backend only saves on a
      # default-branch push, so a tag-triggered release build could never
      # publish a cache entry and would start every run cold.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-${{ matrix.arch }}

      - name: Install nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest

      - name: Run native tests
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast

      - name: Build release binaries
        run: cargo build --release --locked -p k8s-app --bin k8s-app

      - name: Package Linux release artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          install -m 0755 "target/release/k8s-app" "k8s-app-linux-${ARCH}"
          strip "k8s-app-linux-${ARCH}"
          # The tarball keeps the plain `k8s-app` name inside: the updater and
          # install-user flow expect that exact binary name.
          mkdir -p "dist/k8s-gpui-linux-${ARCH}"
          install -m 0755 "k8s-app-linux-${ARCH}" "dist/k8s-gpui-linux-${ARCH}/k8s-app"
          tar -C "dist/k8s-gpui-linux-${ARCH}" -czf "k8s-gpui-linux-${ARCH}.tar.gz" k8s-app
          sha256sum "k8s-gpui-linux-${ARCH}.tar.gz" > "k8s-gpui-linux-${ARCH}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: k8s-gpui-linux-${{ matrix.arch }}
          path: |
            k8s-app-linux-${{ matrix.arch }}
            k8s-gpui-linux-${{ matrix.arch }}.tar.gz
            k8s-gpui-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  bundle_macos:
    needs: [validate_release, create_draft_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner builds the arm64 bundle.
          - runner: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
          # macos-13 is the last Intel image GitHub provides: use it while it
          # exists for the x86_64 bundle.
          - runner: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.1

      # Kept on rust-cache for the tag-push save reason documented in the Linux job.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-${{ matrix.arch }}

      - name: Install nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest

      - name: Run native tests
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast

      # An explicit --target keeps the output path stable across runner images:
      # Apple Silicon and Intel hosts put the binary under their own triple.
      - name: Build release binaries
        run: cargo build --release --locked -p k8s-app --bin k8s-app --target ${{ matrix.target }}

      - name: Resolve the release binary path
        id: bin
        shell: bash
        run: echo "path=target/${{ matrix.target }}/release/k8s-app" >> "$GITHUB_OUTPUT"

      - name: Package an unsigned macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          app="dist/K8s GPUI.app"
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 0755 "${{ steps.bin.outputs.path }}" "$app/Contents/MacOS/k8s-app"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>K8s GPUI</string>
            <key>CFBundleExecutable</key>
            <string>k8s-app</string>
            <key>CFBundleIdentifier</key>
            <string>dev.k8s-gpui.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>K8s GPUI</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$version</string>
            <key>CFBundleVersion</key>
            <string>$version</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          archive="k8s-gpui-macos-${arch}-unsigned.app.tar.gz"
          tar -C dist -czf "$archive" "K8s GPUI.app"
          shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: k8s-gpui-macos-${{ steps.arch.outputs.arch }}-unsigned
          path: |
            k8s-gpui-macos-${{ steps.arch.outputs.arch }}-unsigned.app.tar.gz
            k8s-gpui-macos-${{ steps.arch.outputs.arch }}-unsigned.app.tar.gz.sha256
          if-no-files-found: error

  bundle_windows:
    needs: [validate_release, create_draft_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@1.98.1

      # Kept on rust-cache for the tag-push save reason documented in the Linux job.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-${{ matrix.arch }}

      - name: Install nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest

      - name: Run native tests
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast

      - name: Build release binaries
        run: cargo build --release --locked -p k8s-app --bin k8s-app

      - name: Package an unsigned Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = "${{ matrix.arch }}"
          $package = "dist/k8s-gpui-windows-$arch"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "target/release/k8s-app.exe" "$package/k8s-app.exe"
          $archive = "k8s-gpui-windows-$arch-unsigned.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: k8s-gpui-windows-${{ matrix.arch }}-unsigned
          path: |
            k8s-gpui-windows-${{ matrix.arch }}-unsigned.zip
            k8s-gpui-windows-${{ matrix.arch }}-unsigned.zip.sha256
          if-no-files-found: error

  upload_release_assets:
    needs:
      - validate_release
      - create_draft_release
      - bundle_linux
      - bundle_macos
      - bundle_windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate, sign, and verify the updater manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate_release.outputs.version }}
          K8S_GPUI_UPDATE_PUBLIC_KEY: ${{ vars.K8S_GPUI_UPDATE_PUBLIC_KEY }}
          K8S_GPUI_UPDATE_SIGNING_KEY: ${{ secrets.K8S_GPUI_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${K8S_GPUI_UPDATE_PUBLIC_KEY:-}" || -z "${K8S_GPUI_UPDATE_SIGNING_KEY:-}" ]]; then
            echo "::error::Updater settings are missing. Set K8S_GPUI_UPDATE_PUBLIC_KEY as a repository variable and K8S_GPUI_UPDATE_SIGNING_KEY as a repository secret."
            exit 1
          fi
          for arch in x86_64 aarch64; do
            python3 scripts/update_manifest.py generate \
              --output "release-artifacts/update-linux-${arch}.json" \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" \
              --version "$RELEASE_VERSION" \
              --os linux \
              --arch "$arch" \
              --artifact "release-artifacts/k8s-app-linux-${arch}"
            python3 scripts/sign_update_manifest.py sign \
              --manifest "release-artifacts/update-linux-${arch}.json" \
              --signature "release-artifacts/update-linux-${arch}.json.sig"
            python3 scripts/sign_update_manifest.py verify \
              --manifest "release-artifacts/update-linux-${arch}.json" \
              --signature "release-artifacts/update-linux-${arch}.json.sig"
            python3 scripts/update_manifest.py verify \
              --manifest "release-artifacts/update-linux-${arch}.json" \
              --artifact-root release-artifacts \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" \
              --version "$RELEASE_VERSION" \
              --os linux \
              --arch "$arch" \
              --required-artifact "k8s-app-linux-${arch}"
          done

      - name: Check Linux release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate_release.outputs.version }}
        run: |
          set -euo pipefail
          # The stripped binary still links libxcb/libxkbcommon: install the
          # runtime libraries so `k8s-app --version` can load on this clean
          # runner (the build job only brought in the -dev packages).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1 libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1
          test -s release-artifacts/k8s-app-linux-x86_64
          test -s release-artifacts/k8s-app-linux-aarch64
          chmod 0755 release-artifacts/k8s-app-linux-x86_64 release-artifacts/k8s-app-linux-aarch64
          if ! file release-artifacts/k8s-app-linux-x86_64 | grep -E 'ELF 64-bit.*x86-64' >/dev/null; then
            echo "::error::release-artifacts/k8s-app-linux-x86_64 is not a Linux x86_64 ELF binary. Check the build artifact."
            exit 1
          fi
          if ! file release-artifacts/k8s-app-linux-aarch64 | grep -E 'ELF 64-bit.*aarch64' >/dev/null; then
            echo "::error::release-artifacts/k8s-app-linux-aarch64 is not a Linux aarch64 ELF binary. Check the build artifact."
            exit 1
          fi
          (
            cd release-artifacts
            shopt -s nullglob
            checksums=( *.sha256 )
            if ((${#checksums[@]} == 0)); then
              echo "::error::No SHA-256 sidecar files were downloaded. Check the artifact upload."
              exit 1
            fi
            sha256sum --check "${checksums[@]}"
          )
          # Only the x86_64 binary can execute on this runner.
          set +e
          version_output="$(timeout 3s release-artifacts/k8s-app-linux-x86_64 --version 2>&1)"
          version_status=$?
          set -e
          if [[ "$version_status" -ne 0 || "$version_output" != "k8s-app ${RELEASE_VERSION}" ]]; then
            echo "::error::k8s-app --version did not report k8s-app $RELEASE_VERSION (status=$version_status): $version_output"
            exit 1
          fi

      - name: Refuse published or conflicting release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [[ "$draft" != "true" ]]; then
            echo "::error::Do not upload assets to a published release. Create a new draft release instead."
            exit 1
          fi
          shopt -s nullglob
          assets=( release-artifacts/* )
          if ((${#assets[@]} == 0)); then
            echo "::error::No release assets were found. Check the downloaded artifacts and build jobs."
            exit 1
          fi
          existing="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for path in "${assets[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Release asset is not a regular file: $path. Check the artifact path."
              exit 1
            fi
            name="${path##*/}"
            if printf '%s\n' "$existing" | grep -Fx "$name" >/dev/null; then
              echo "::error::Release asset already exists and will not be overwritten: $name. Remove it from the draft release before retrying."
              exit 1
            fi
          done

      - name: Upload assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=( release-artifacts/* )
          if ((${#assets[@]} == 0)); then
            echo "::error::No release assets were found. Check the downloaded artifacts and build jobs."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
