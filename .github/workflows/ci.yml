name: run_tests

on:
  merge_group:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - "v[0-9]+.[0-9]+.x"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "600"

jobs:
  orchestrate:
    name: orchestrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks to run
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$RUNNER_TEMP/changed-files"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          set +e
          grep -zEq '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/)' "$changed_files"
          match_status=$?
          set -e
          case "$match_status" in
            0)
              echo "Native or CI files changed. Run all native checks."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "No native or CI files changed. Skip native checks."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Cannot inspect changed files. Check the checkout and Git diff."
              exit "$match_status"
              ;;
          esac

  style:
    name: style
    needs: orchestrate
    if: needs.orchestrate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.name }})
    needs: [orchestrate, style]
    if: needs.orchestrate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            cc: clang
            cxx: clang++
          - name: macos
            os: macos-latest
            cc: ""
            cxx: ""
          - name: windows
            os: windows-latest
            cc: ""
            cxx: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: audit
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm make cmake pkg-config \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libstdc++-12-dev libva-dev libvulkan1 libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev \
            git curl jq
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      # mbx restores the target tree and registry of the newest matching entry and
      # serves the rest of the workspace from its compiler cache. The key is
      # explicit because the generated one only covers OS, arch, and toolchain, so
      # the clippy and test jobs would otherwise fight over a single entry.
      - name: Set up the build cache
        uses: jdx/mr-boxington-action@d0825fbaf3cc36ca2609aa38e71046265a1f1e37
        with:
          cache-key: clippy-${{ matrix.name }}-${{ runner.arch }}-mbx-${{ github.sha }}
          restore-keys: |
            clippy-${{ matrix.name }}-${{ runner.arch }}-mbx-
      - name: Run Clippy on the workspace
        run: mbx clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    needs: [orchestrate, style]
    if: needs.orchestrate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            cc: clang
            cxx: clang++
          - name: macos
            os: macos-latest
            cc: ""
            cxx: ""
          - name: windows
            os: windows-latest
            cc: ""
            cxx: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: audit
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm make cmake pkg-config \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libstdc++-12-dev libva-dev libvulkan1 libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev \
            git curl jq
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
      # Keyed per job, for the same reason as the clippy job above.
      - name: Set up the build cache
        uses: jdx/mr-boxington-action@d0825fbaf3cc36ca2609aa38e71046265a1f1e37
        with:
          cache-key: test-${{ matrix.name }}-${{ runner.arch }}-mbx-${{ github.sha }}
          restore-keys: |
            test-${{ matrix.name }}-${{ runner.arch }}-mbx-
      - name: Install nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: nextest
      - name: Run workspace tests
        run: mbx nextest run --workspace --all-features --locked --no-fail-fast
      - name: Run workspace documentation tests
        run: mbx test --workspace --all-features --locked --doc
