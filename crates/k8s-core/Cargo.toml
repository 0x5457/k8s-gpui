[package]
name = "k8s-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dirs.workspace = true
tempfile.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
kube.workspace = true
json-patch = "4"
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
futures = "0.3"
serde_yaml_ng.workspace = true
chrono.workspace = true
http = "1"
statig.workspace = true
semver = { version = "1", features = ["serde"] }
tracing = "0.1"
nucleo = "0.5"

[dev-dependencies]
proptest = "1"

# The data-layer benchmark reports p50/p95/p99 itself and asserts the budgets, so it needs
# the default harness turned off and no benchmark framework in the dependency tree.
[[bench]]
name = "projection"
harness = false

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
