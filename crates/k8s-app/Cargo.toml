[package]
name = "k8s-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "k8s-app"
# src/bin/table-spike.rs is a benchmark harness behind `--features spike`,
# not shipped application code. Declaring it explicitly keeps it out of the
# default `cargo build` and out of release installs.
autobins = false

[features]
spike = ["k8s-ui/spike"]

[[bin]]
name = "k8s-app"
path = "src/main.rs"

[[bin]]
name = "table-spike"
path = "src/bin/table-spike.rs"
required-features = ["spike"]

[dependencies]
anyhow.workspace = true
ed25519-dalek = "2.2"
hex = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
tempfile.workspace = true
gpui-kit.workspace = true
k8s-actions = { path = "../k8s-actions" }
k8s-core = { path = "../k8s-core" }
k8s-term = { path = "../k8s-term" }
k8s-ui = { path = "../k8s-ui" }
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
kube.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
